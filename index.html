<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>말씀길 — colophonlabs.kr로 이동합니다</title>
<meta name="robots" content="noindex">
<!-- 별칭 도메인(.co.kr) → 정식 주소(.kr). 스크립트 없이 meta refresh만 쓴다. -->
<meta http-equiv="refresh" content="0; url=https://colophonlabs.kr/">
<link rel="canonical" href="https://colophonlabs.kr/">
<style>
  :root{--paper:#F7F6F2; --ink:#22262B; --jjok:#33527A; --muted:#6E6A61}
  *{box-sizing:border-box; margin:0; padding:0}
  html{background:var(--paper)}
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
      "Malgun Gothic", "Noto Sans KR", sans-serif;
    color:var(--ink); font-size:17px; line-height:1.75;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    -webkit-font-smoothing:antialiased; text-align:center;
  }
  .card{max-width:24rem; padding:2rem 1.5rem}
  .brand{color:var(--jjok); font-size:.85rem; font-weight:700; letter-spacing:.35em; margin-bottom:1rem}
  p{color:var(--muted)}
  a{display:inline-block; margin-top:1.25rem; color:var(--jjok); font-weight:600; text-underline-offset:3px}
</style>
</head>
<body>
<main class="card">
  <p class="brand">COLOPHON LABS</p>
  <p>말씀길의 주소가 <strong>colophonlabs.kr</strong>로 바뀌었습니다. 잠시 후 자동으로 이동합니다.</p>
  <a href="https://colophonlabs.kr/">바로 이동하기</a>
</main>
</body>
</html>
